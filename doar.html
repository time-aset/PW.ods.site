<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>SiteOds</title>
</head>

<body>
    <header>

        <p id="titulo1"> Água e Saneamento</p>

    </header>

    <div class="faixa-branca"></div>

    <nav id="menu">
        <a href="">Inicio</a>
        <a href="">Ods</a>
        <a href="">Doar</a>
        <a href="">Doações</a>
    </nav>

    <main>
        <div class="form-box">
            <h2>Fale conosco</h2>
            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@exemplo.com">

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem..."></textarea>

                <label for="doacao">Doação</label>
                <input type="number" id="doacao" name="doacao" placeholder="Digite o quanto deseja doar">

                <div class="radio-group">
                    <p>Deseja apresentar a doação?</p>
                    <label><input type="radio" name="apresentar_doacao" value="sim" checked> Sim</label>
                    <label><input type="radio" name="apresentar_doacao" value="nao"> Não</label>
                </div>

                <button onclick="enviar()" >Enviar</button>
            </form>
        </div>
    </main>
    <footer>
        <p id="footer-text"> &copy; 2026 SiteODS - Todos os direitos reservados.</p>

    </footer>
</body>
    <script>
        function enviar(){
            let nome = document.getElementById('nome').value
            let email = document.getElementById('email').value
            let mensagem = document.getElementById('mensagem').value
            let doacao = document.getElementById('doacao').value

            sessionStorage.getItem('nome', nome)
            sessionStorage.getItem('email', email)
            sessionStorage.getItem('mensagem', mensagem)
            sessionStorage.getItem('doacao', doacao)
       
            window.location.href = 'doacoes.html'
        }
    </script>
</html>
