<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>SiteOds</title>
</head>

<body>
    <header>

        <p id="titulo1"> ÁGUA E SANEAMENTO</p>

    </header>



    <nav id="menu">
        <a href="index.html">Início</a><span class="separador">|</span>
        <a href="ods.html">Ods</a><span class="separador">|</span>
        <a href="paises.html">Países</a><span class="separador">|</span>
        <a href="doar.html">Doar</a><span class="separador">|</span>
    </nav>

    <div class="container">
        <container class="head-baby"></container>
    </div>

    <main class="form-main form-main-doar">
        <div class="container container-doar">
            <div class="form-box form-box-doar">
                <h2>Fale conosco</h2>
                <form class="meuFormulario-doar" onsubmit="event.preventDefault(); enviar();">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome">

                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email" placeholder="seu@exemplo.com">

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem..."></textarea>

                    <label for="doacao">Doação</label>
                    <input type="number" id="doacao" name="doacao" placeholder="Digite o quanto deseja doar">

                    <div class="radio-group-doar">
                        <p>Deseja apresentar a doação?</p>
                        <label><input type="radio" name="apresentar_doacao" value="sim" checked> Sim</label>
                        <label><input type="radio" name="apresentar_doacao" value="nao"> Não</label>
                    </div>

                    <button class="button-doar" type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <p id="footer-text"> &copy; 2026 SiteODS - Todos os direitos reservados.</p>
    </footer>

    <div class="popup-doar" id="popupDoar">
        <div class="popup-conteudo-doar">
            <h3 id="popupTitulo">Obrigado!</h3>
            <p id="popupMensagem">Sua doação foi registrada com sucesso.</p>
            <button type="button" onclick="fecharPopupDoar()">Fechar</button>
        </div>
    </div>

    <script>
        function enviar() {
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const mensagem = document.getElementById('mensagem').value.trim();
            const doacao = document.getElementById('doacao').value.trim();

            if (!nome || !email || !mensagem || !doacao) {
                mostrarPopup('ERRO', 'Preencha todos os campos antes de enviar.');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                mostrarPopup('ERRO', 'Informe um e-mail válido.');
                return;
            }

            if (Number(doacao) <= 0) {
                mostrarPopup('ERRO', 'A doação precisa ser maior que zero.');
                return;
            }

            mostrarPopup('Obrigado!', 'Sua doação foi registrada com sucesso.');
        }

        function mostrarPopup(titulo, mensagem) {
            document.getElementById('popupTitulo').textContent = titulo;
            document.getElementById('popupMensagem').textContent = mensagem;
            document.getElementById('popupDoar').style.display = 'flex';
        }

        function fecharPopupDoar() {
            document.getElementById('popupDoar').style.display = 'none';
        }
    </script>
</body>
</html>
